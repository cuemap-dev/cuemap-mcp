name: Package validation
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: cuemap-dev/typescript-sdk
          ref: v0.7.3
          path: .release-sdk
      - run: npm ci
        working-directory: .release-sdk
      - run: npm run build
        working-directory: .release-sdk
      - run: npm install --ignore-scripts --omit=optional --no-save --package-lock=false ./.release-sdk
      - run: npm test
      - run: npm pack --dry-run
